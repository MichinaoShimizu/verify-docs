name: CI report

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  update-pr-comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Node 24 ランタイムの v8 を完全長コミット SHA に固定する。
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const marker = '<!-- verify-docs-ci-report -->';
            const run = context.payload.workflow_run;
            const pullRequest = run.pull_requests[0];

            if (!pullRequest) {
              core.info('The completed workflow is not associated with a pull request.');
              return;
            }

            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              filter: 'latest',
              per_page: 100,
            });
            const conclusions = new Map(jobs.jobs.map((job) => [job.name, job.conclusion]));
            const result = (job) => {
              if (job === 'remote-install-smoke' && run.event === 'pull_request') {
                return ':fast_forward:';
              }
              switch (conclusions.get(job)) {
                case 'success': return ':white_check_mark:';
                case 'failure':
                case 'timed_out': return ':x:';
                case 'cancelled': return ':white_circle:';
                case 'skipped': return ':fast_forward:';
                case 'action_required': return ':warning:';
                default: return ':hourglass_flowing_sand:';
              }
            };

            const rows = [
              ['verify-docs-root-check', 'Markdown のリンク、孤立文書、サイズ、重複段落を検査する。'],
              ['verify-docs-self-check', 'スキルからの `docs/` 参照、配布用 `references/` 生成、導入・再導入・競合拒否・互換リンクを検査する。'],
              ['verify-docs-minimum-node', '最低対応版の Node.js 22.0.0 で `verify-docs-self-check` と同じ自己検査を実行する。'],
              ['remote-install-smoke', '`main` マージ後に、公開 raw `install.sh` と同じrefのアーカイブから導入し、配布形と導入済み CLI を検査する。'],
            ];
            const body = [
              marker,
              '## CI 確認結果',
              '',
              `対象 commit: \`${run.head_sha}\``,
              '',
              '| 結果 | ジョブ | 担保すること |',
              '| --- | --- | --- |',
              ...rows.map(([job, guarantee]) => `| ${result(job)} | \`${job}\` | ${guarantee} |`),
              '',
              `実行結果: [${run.name} #${run.run_number}](${run.html_url})`,
              '',
              'この報告は CI 完了ごとに同じコメントを更新する。実ホストでのスキル起動、利用者側の文書内容、Node.js 23 以上の各版の動作は、この CI の保証対象外である。',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker),
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
              core.info(`Updated CI report comment ${previous.id}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                body,
              });
              core.info('Created CI report comment.');
            }
